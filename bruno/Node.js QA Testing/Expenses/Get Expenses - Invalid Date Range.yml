info:
  name: Get Expenses - Invalid Date Range
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/billing/expenses?from=2026-10-28&to=2026-10-01
  params:
    - name: from
      value: 2026-10-28
      type: query
    - name: to
      value: 2026-10-01
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
