info:
  name: Get Expenses - Invalid Category
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/billing/expenses?category=INVALID
  params:
    - name: category
      value: INVALID
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
