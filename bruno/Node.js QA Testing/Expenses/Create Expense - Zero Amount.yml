info:
  name: Create Expense - Zero Amount
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/billing/expenses
  body:
    type: json
    data: |-
      {
        "category": "FOOD",
        "description": "Закупівля продуктів",
        "amount": 0,
        "expenseDate": "2026-10-28"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
