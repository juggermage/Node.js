info:
  name: Get Expenses - Date Outside Range
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/billing/expenses?from=2026-01-01&to=2026-01-31
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2026-01-31
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
