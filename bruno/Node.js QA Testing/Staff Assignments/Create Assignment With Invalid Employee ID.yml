info:
  name: Create Assignment With Invalid Employee ID
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/staff-assignments
  body:
    type: json
    data: |-
      {
        "employeeId": "invalid-id",
        "groupId": "000000000000000000000000",
        "role": "EDUCATOR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
