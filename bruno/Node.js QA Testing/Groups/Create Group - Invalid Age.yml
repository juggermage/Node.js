info:
  name: Create Group - Invalid Age
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/groups
  body:
    type: json
    data: |-
      {
        "name": "Invalid Age Group",
        "ageFromMonths": 48,
