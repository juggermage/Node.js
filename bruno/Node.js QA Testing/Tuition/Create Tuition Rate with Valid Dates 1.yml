info:
  name: Create Tuition Rate with Valid Dates
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/v1/billing/tuition/rates
  body:
    type: json
    data: |-
      {
        "name": "Test October 2026",
        "amount": 14000,
        "validFrom": "2026-10-01",
        "validTo": "2026-10-31"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
