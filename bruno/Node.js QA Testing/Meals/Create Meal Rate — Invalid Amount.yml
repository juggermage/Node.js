info:
  name: Create Meal Rate — Invalid Amount
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:3000/api/v1/meals/rates
  body:
    type: json
    data: |-
      {
        "ageYears": 5,
        "amount": -100,
        "validFrom": "2026-11-01",
        "validTo": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
