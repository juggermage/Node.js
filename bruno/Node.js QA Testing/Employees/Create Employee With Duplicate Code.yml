info:
  name: Create Employee With Duplicate Code
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/employees
  body:
    type: json
    data: |-
      {
        "employeeCode": "EMP001",
        "firstName": "Марія",
        "lastName": "Коваль",
        "role": "EDUCATOR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
