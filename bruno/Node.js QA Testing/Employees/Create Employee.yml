info:
  name: Create Employee
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/employees
  body:
    type: json
    data: |-
      {
        "employeeCode": "EMP008",
        "firstName": "Тест",
        "lastName": "Вихователь",
        "role": "EDUCATOR",
        "phone": "+380991234570",
        "email": "educator.test@example.com"
      }
