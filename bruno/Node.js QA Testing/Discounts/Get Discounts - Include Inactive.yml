info:
  name: Get Discounts - Include Inactive
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/billing/discounts?includeInactive=true
  params:
    - name: includeInactive
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
